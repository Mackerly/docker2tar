name: 编译 OpenWRT

on:
  # push:
  #   branches: [ main ]
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  TAG: v19.07.10

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@main
    
    - name: 安装依赖
      run: |
        sudo timedatectl set-timezone "$TZ"
        sudo apt-get update
        sudo apt-get install -y build-essential clang libssl-dev libncurses5-dev \
          libncursesw5-dev zlib1g-dev gawk git gettext curl wget rsync perl \
          python3 mkisofs ecj fastjar java-propose-classpath bc binutils-gold \
          bison build-essential ccache ecj fastjar file flex g++ gawk gcc-arm* \
          gettext git help2man libbsd-dev libelf-dev liblzma-dev libncurses-dev \
          libssl-dev mtd-utils meson mold mtd-utils ninja-build pbzip2 pigz pkg-config \
          python3-dev python3-setuptools rsync subversion swig texinfo time u-boot-tools \
          unzip wget xsltproc xxd zlib1g-dev zstd python2

    - name: 安装 Python 2.7 环境，用于编译 openwrt 19.x
      if: env.TAG == 'v19.07.101'
      run: |
        # 1. 允许 Ubuntu 22.04 及以上系统从官方 universe 软件源中寻找 python2
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        
        # 2. 安装 Python2 核心与基本库
        sudo apt-get install -y python2 python2-dev python-is-python2
        
        # 3. 补全 OpenWrt 19 编译所需的额外特定 Python 库（部分老固件可能需要）
        sudo apt-get install -y python-crypto python-openssl || true
        
        # 4. 验证环境是否生效
        python --version
        python2 --version

    
    - name: 克隆 OpenWrt 并切换到对应的版本  ${{ env.TAG }}
      run: |
        rm -rf openwrt  # 删除已存在的目录
        git clone https://git.openwrt.org/openwrt/openwrt.git
    #    cd openwrt
    #     git checkout ${{ env.TAG }} # 切换到指定的 tag 会因为kmod版本等不对，导致无法使用官方源

    - name: 修改 v24.10.8 的 DTS 和 mk 文件
      if: env.TAG == 'v24.10.8'
      run: |
        cd openwrt
        sed -i '462s/7872/16000/'  target/linux/ramips/image/mt76x8.mk
        sed -i '59s/7b/fb/' target/linux/ramips/dts/mt7628an_mediatek_mt7628an-eval-board.dts        

    - name: 修改 v19.07.10 的 DTS 和 mk 文件
      if: env.TAG == 'v19.07.10'
      run: |
        cd openwrt
        git checkout 9ce6aa9d8d # 来源对应官方下载的 version.buildinfo
        curl -L -o feeds.conf "https://archive.openwrt.org/releases/19.07.10/targets/ramips/mt76x8/feeds.buildinfo"
        sed -i '106s/7b/fb/' target/linux/ramips/dts/ZBT-WE1226.dts
        sed -i '473s/8M/16M/'  target/linux/ramips/image/mt76x8.mk        

    - name: 自定义Board Config，如果版本是 v19.07.10
      if: env.TAG == 'v19.07.10'
      run: |
        cd openwrt
        # 1. 创建目标目录（如果不存在）
        mkdir -p files/etc/uci-defaults
        
        # 2. 写入修改 board.json 的脚本内容
        ##########################################
        cat << 'EOF' > files/etc/uci-defaults/99-modify-board
        #!/bin/sh
        BOARD_JSON="/etc/board.json"
        [ -f "$BOARD_JSON" ] || exit 0
        
        OLD_STR='"0:lan:2" "1:lan:1" "4:wan" "6@eth0"'
        NEW_STR='"0:lan" "1:lan" "2:lan" "3:lan" "4:wan" "6@eth0"'
        
        sed -i "s/$OLD_STR/$NEW_STR/g" "$BOARD_JSON"
        exit 0
        EOF
        ##########################################
        cat << 'EOF' > files/etc/uci-defaults/fist_settings
        #!/bin/sh

        uci add_list dhcp.@dnsmasq[0].confdir=/etc/dnsmasq.d
        uci add_list dhcp.@dnsmasq[0].cachesize=10000
        uci commit dhcp

        uci set luci.main.lang=zh_cn
        uci commit luci

        uci set system.@system[0].timezone=CST-8
        uci set system.@system[0].zonename=Asia/Shanghai
        uci commit system

        uci del dhcp.lan.dhcp_option
        uci add_list dhcp.lan.dhcp_option='6,223.5.5.5,223.6.6.6'

        # /etc/config/network

        uci del network.lan.dns
        uci add_list network.lan.dns='223.5.5.5'
        uci add_list network.lan.dns='223.6.6.6'
        uci set network.lan.ipaddr='192.168.8.1'
        uci commit

        sed -i '/option disabled/d' /etc/config/wireless  
        
        exit 0
        EOF

        
        # 3. 赋予脚本执行权限
        chmod +x files/etc/uci-defaults/99-modify-board 
        chmod +x files/etc/uci-defaults/fist_settings

    - name: 更新 Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
    
    - name: 应用配置文件
      run: |
        cd openwrt
        [ -e .config ] && rm .config
        # 从仓库中复制预配置的 .config
        # cp "${{ github.workspace }}/openwrt_config/76x8.config" .config
        cp "${{ github.workspace }}/openwrt_config/ZBT-WE1226.config" .config
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
    
    - name: 编译
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 检查空间使用情况
      if: (!cancelled()) # 即使前面的步骤失败，只要工作流未被手动取消，这个步骤也会执行
      run: df -hT
    
    - name: 上传固件
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success'
      with:
        name: OpenWrt-firmware
        path: openwrt/bin/targets

    - name: Organize files
      id: organize
      if: (!cancelled())
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传 firmware 目录
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 生成发布的 tag
      id: tag
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 发布固件
      uses: softprops/action-gh-release@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*


    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 推送通知到电报
      if: always()  # 总是运行（无论成功或失败）
      run: |
        curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="✅ Build Success%0A%0ARelease: ${{ steps.tag.outputs.release_tag }}%0AStatus: ${{ steps.tag.outputs.status }}"
