name: 编译 OpenWRT

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: 安装依赖
      run: |
        sudo timedatectl set-timezone "$TZ"
        sudo apt-get update
        sudo apt-get install -y build-essential clang libssl-dev libncurses5-dev \
          libncursesw5-dev zlib1g-dev gawk git gettext curl wget rsync perl \
          python3 mkisofs ecj fastjar java-propose-classpath bc binutils-gold \
          bison build-essential ccache ecj fastjar file flex g++ gawk gcc-arm* \
          gettext git help2man libbsd-dev libelf-dev liblzma-dev libncurses-dev \
          libssl-dev mtd-utils meson mold mtd-utils ninja-build pbzip2 pigz pkg-config \
          python3-dev python3-setuptools rsync subversion swig texinfo time u-boot-tools \
          unzip wget xsltproc xxd zlib1g-dev zstd
    
    - name: 克隆 OpenWrt 并 切换到对应的版本
      run: |
        git clone https://git.openwrt.org/openwrt/openwrt.git
        cd openwrt
        pwd && ls -l
        git checkout v24.10.8 # 切换到指定的 tag
        sed -i '462s/.*/\tIMAGE_SIZE := 16000k/' target/linux/ramips/image/mt76x8.mk
        sed -i 's/reg = <0x50000 0x7b0000>/reg = <0x50000 0xfb0000>;/' target/linux/ramips/dts/mt7628an_mediatek_mt7628an-eval-board.dts


    
    - name: 更新 Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
    
    - name: 应用配置文件
      run: |
        cd openwrt
        # 从仓库中复制预配置的 .config
        cp openwrt/.config .config 2>/dev/null || make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
    
    - name: 编译
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
    
    - name: 上传固件
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success'
      with:
        name: OpenWrt-firmware
        path: openwrt/bin/targets/
