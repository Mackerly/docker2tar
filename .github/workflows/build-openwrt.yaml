name: 编译 OpenWRT

on:
  # push:
  #   branches: [ main ]
  workflow_dispatch:

env:
  TZ: Asia/Shanghai


jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: 安装依赖
      run: |
        sudo timedatectl set-timezone "$TZ"
        sudo apt-get update
        sudo apt-get install -y build-essential clang libssl-dev libncurses5-dev \
          libncursesw5-dev zlib1g-dev gawk git gettext curl wget rsync perl \
          python3 mkisofs ecj fastjar java-propose-classpath bc binutils-gold \
          bison build-essential ccache ecj fastjar file flex g++ gawk gcc-arm* \
          gettext git help2man libbsd-dev libelf-dev liblzma-dev libncurses-dev \
          libssl-dev mtd-utils meson mold mtd-utils ninja-build pbzip2 pigz pkg-config \
          python3-dev python3-setuptools rsync subversion swig texinfo time u-boot-tools \
          unzip wget xsltproc xxd zlib1g-dev zstd
    
    - name: 克隆 OpenWrt 并 切换到对应的版本
      run: |
        rm -rf openwrt  # 删除已存在的目录
        git clone https://git.openwrt.org/openwrt/openwrt.git
        cd openwrt
        git checkout v24.10.8 # 切换到指定的 tag
        sed -i '462s/7872/16000/'  target/linux/ramips/image/mt76x8.mk
        sed -i '59s/7b/fb/' target/linux/ramips/dts/mt7628an_mediatek_mt7628an-eval-board.dts
    
    - name: 更新 Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
    
    - name: 应用配置文件
      run: |
        cd openwrt
        [ -e .config ] && rm .config
        # 从仓库中复制预配置的 .config
        pwd
        ls -la
        ls -la openwrt_config || true
        ls -la openwrt_config/myconfig || true
        ls -la "${{ github.workspace }}" || true
        cp "${{ github.workspace }}/openwrt_config/76x8.config" .config
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
    
    - name: 编译
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 检查空间使用情况
      if: (!cancelled()) # 即使前面的步骤失败，只要工作流未被手动取消，这个步骤也会执行
      run: df -hT
    
    - name: 上传固件
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success'
      with:
        name: OpenWrt-firmware
        path: openwrt/bin/targets

    - name: Organize files
      id: organize
      if: (!cancelled())
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传 firmware 目录
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 生成发布的 tag
      id: tag
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 发布固件
      uses: softprops/action-gh-release@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*


    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 推送通知到电报
      if: always()  # 总是运行（无论成功或失败）
      run: |
        curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="✅ Build Success%0A%0ARelease: ${{ steps.tag.outputs.release_tag }}%0AStatus: ${{ steps.tag.outputs.status }}"
